version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: recruitment-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: recruitment_db
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - recruitment-network

  backend:
    build: ./backend
    container_name: recruitment-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/recruitment_db?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      AI_SERVICE_URL: http://ai-service:5000
    depends_on:
      - mysql
      - ai-service
    networks:
      - recruitment-network

  ai-service:
    build: ./ai-service
    container_name: recruitment-ai-service
    ports:
      - "5000:5000"
    networks:
      - recruitment-network

  frontend:
    build: ./frontend
    container_name: recruitment-frontend
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_URL: http://localhost:8080/api
    depends_on:
      - backend
    networks:
      - recruitment-network

volumes:
  mysql-data:

networks:
  recruitment-network:
    driver: bridge
